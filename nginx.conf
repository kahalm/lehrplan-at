user  nginx;
worker_processes  auto;

# Fehler nach stderr -> via `docker logs` sichtbar.
error_log  /dev/stderr notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # JSON-Zugriffslog fuer Fluent Bit. Feldnamen mit nginx_-Praefix, damit es
    # im gemeinsamen lehrplan-Index keine Mapping-Konflikte mit den ECS-Feldern
    # der Serilog-Sink (lernkompass-API) gibt.
    log_format  json_lehrplan  escape=json
        '{'
            '"nginx_time":"$time_iso8601",'
            '"nginx_remote":"$remote_addr",'
            '"nginx_method":"$request_method",'
            '"nginx_path":"$uri",'
            '"nginx_query":"$args",'
            '"nginx_status":$status,'
            '"nginx_bytes":$body_bytes_sent,'
            '"nginx_referer":"$http_referer",'
            '"nginx_agent":"$http_user_agent",'
            '"nginx_request_time":$request_time'
        '}';

    # In eine echte Datei (geteiltes Volume) schreiben, damit Fluent Bit sie tailen kann.
    access_log  /var/log/nginx/access.json  json_lehrplan;

    sendfile        on;
    keepalive_timeout  65;

    # Default-Server (Docusaurus statisch ausliefern) bleibt unveraendert.
    include /etc/nginx/conf.d/*.conf;
}
