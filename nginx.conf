user  nginx;
worker_processes  auto;

# Fehler nach stderr -> via `docker logs` sichtbar.
error_log  /dev/stderr notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Echte Client-IP statt der Proxy-IP: Die Anfragen kommen ueber den Nginx Proxy
    # Manager bzw. den Docker-Port (Gateway 192.168.x.1), $remote_addr waere daher immer
    # dieselbe interne Adresse. Mit real_ip ersetzt nginx $remote_addr durch die IP aus
    # X-Forwarded-For -- aber NUR wenn die Anfrage aus einem der hier gelisteten
    # Netze kommt. Ohne diese Einschraenkung koennte jeder Client seine IP faelschen,
    # indem er den Header selbst setzt. (Gleiche Regel wie im pensionsrechner.)
    set_real_ip_from  172.16.0.0/12;    # Docker-Netze (u.a. nginx-proxy-net 172.21.0.0/16)
    set_real_ip_from  10.0.0.0/8;       # privates LAN
    set_real_ip_from  192.168.0.0/16;   # privates LAN + Docker-Gateway des Stacks
    real_ip_header    X-Forwarded-For;
    # Kette von rechts nach links durchgehen und vertraute Adressen ueberspringen,
    # damit bei mehreren Proxies die erste untrusted (= echte Client-)IP gewinnt.
    real_ip_recursive on;

    # IP-Anonymisierung: letztes Oktett auf 0 (IPv6: nur die ersten zwei Bloecke). Damit
    # bleiben Zugriffszahlen und grobe Herkunft auswertbar, der Personenbezug entfaellt.
    map $remote_addr $remote_addr_anon {
        ~^(?<v4>\d+\.\d+\.\d+)\.\d+$   "$v4.0";
        ~^(?<v6>[0-9a-fA-F]+:[0-9a-fA-F]+):  "$v6::";
        default                              "0.0.0.0";
    }

    # JSON-Zugriffslog fuer Fluent Bit. Feldnamen mit nginx_-Praefix, damit es
    # im gemeinsamen lehrplan-Index keine Mapping-Konflikte mit den ECS-Feldern
    # der Serilog-Sink (lernkompass-API) gibt.
    log_format  json_lehrplan  escape=json
        '{'
            '"nginx_time":"$time_iso8601",'
            '"nginx_remote":"$remote_addr_anon",'
            '"nginx_method":"$request_method",'
            '"nginx_path":"$uri",'
            '"nginx_query":"$args",'
            '"nginx_status":$status,'
            '"nginx_bytes":$body_bytes_sent,'
            '"nginx_referer":"$http_referer",'
            '"nginx_agent":"$http_user_agent",'
            '"nginx_request_time":$request_time'
        '}';

    # In eine echte Datei (geteiltes Volume) schreiben, damit Fluent Bit sie tailen kann.
    access_log  /var/log/nginx/access.json  json_lehrplan;

    sendfile        on;
    keepalive_timeout  65;

    # Default-Server (Docusaurus statisch ausliefern) bleibt unveraendert.
    include /etc/nginx/conf.d/*.conf;
}
