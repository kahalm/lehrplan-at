[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf

[INPUT]
    Name              tail
    Path              /var/log/nginx/access.json
    Tag               lehrplan.web
    Parser            nginx_json
    Refresh_Interval  5
    # Auch bereits vorhandene Zeilen ab Dateianfang lesen (z.B. Backlog zwischen
    # nginx- und Fluent-Bit-Start). Die Position-DB verhindert Doppelversand bei Neustart.
    Read_from_Head    On
    DB                /var/log/nginx/flb_pos.db

[FILTER]
    Name    record_modifier
    Match   lehrplan.web
    # Markierung wie in der lernkompass-API; Quelle unterscheidet Web- von API-Zugriffen.
    Record  application  lehrplan-at
    Record  Environment  ${APP_ENV}
    Record  LogType      LehrplanZugriff
    Record  Quelle       Website

[OUTPUT]
    Name               es
    Match              lehrplan.web
    Host               ${ELASTICSEARCH_HOST}
    Port               ${ELASTICSEARCH_PORT}
    # Eigener regulaerer Index "<lehrplan-index>-web" (wird automatisch angelegt,
    # dynamisches Mapping). Bewusst NICHT der Serilog-Data-Stream
    # (<index>-generic-default), um Kopplung an dessen Namens-/ECS-Konvention zu
    # vermeiden. Beide sind gemeinsam ueber das Pattern "<lehrplan-index>*" abfragbar.
    Index              ${ELASTICSEARCH_LEHRPLAN_INDEX}-web
    Suppress_Type_Name On
    Trace_Error        On
