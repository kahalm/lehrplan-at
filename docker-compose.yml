services:
  lehrplan:
    image: ghcr.io/kahalm/lehrplan-at:latest
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      # nginx schreibt das JSON-Zugriffslog hierher, Fluent Bit liest es.
      - nginx-logs:/var/log/nginx

  # Versendet jeden Website-Aufruf an den gemeinsamen lehrplan-Index in Elasticsearch.
  fluent-bit:
    image: fluent/fluent-bit:3.1
    restart: unless-stopped
    depends_on:
      - lehrplan
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.conf"]
    environment:
      APP_ENV: ${APP_ENV:-prod}
      ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST:-10.24.13.6}
      ELASTICSEARCH_PORT: ${ELASTICSEARCH_PORT:-9200}
      # Sollte dem ELASTICSEARCH_LEHRPLAN_INDEX der lernkompass-API entsprechen.
      # Fluent Bit schreibt nach "<wert>-web"; gemeinsam mit dem API-Data-Stream
      # ueber das Pattern "<wert>*" abfragbar.
      ELASTICSEARCH_LEHRPLAN_INDEX: ${ELASTICSEARCH_LEHRPLAN_INDEX:-lehrplan-prod}
    volumes:
      - nginx-logs:/var/log/nginx
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro

volumes:
  nginx-logs:
